        border-radius: 20px
      }

      .case-detail .chapter {
        padding: 22px 16px;
        border-radius: 20px
      }

      .case-detail .chapter .slabs .face {
        min-height: 98px;
        padding: 12px 10px;
        border-radius: 16px
      }

      .case-quick-results .face {
        min-height: 86px;
        padding: 12px 10px;
        border-radius: 16px
      }

    }

    /* Keep approach titles in the text column and let chapter content use the full mobile width. */
    .case-detail .steps li {
      grid-template-columns: minmax(0, 1fr);
      min-width: 0
    }

    .case-detail .steps li h3,
    .case-detail .steps li p {
      grid-column: 1;
      min-width: 0;
      overflow-wrap: anywhere
    }

    @media (max-width:640px) {

      .case-detail .chapter .slabs,
      .case-detail .chapter .ch,
      .case-detail .chapter .steps,
      .case-detail .chapter .vid,
      .case-detail .chapter .insight,
      .case-detail .chapter .why,
      .case-detail .chapter .note {
        margin-left: 0
      }

    }

    @media (max-width:640px) {
      .case-detail .facts,
      .case-detail .brief {
        display: block;
        max-height: none;
        overflow: visible
      }

      .case-detail .facts>summary,
      .case-detail .brief>summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        list-style: none
      }

      .case-detail .facts>summary::-webkit-details-marker,
      .case-detail .brief>summary::-webkit-details-marker,
      .case-detail .chapter>summary::-webkit-details-marker {
        display: none
      }

      .case-detail .facts>summary::after,
      .case-detail .brief>summary::after {
        content: "+";
        flex: 0 0 auto;
        color: var(--brand);
        font: 500 1.2rem/1 var(--sans)
      }

      .case-detail .facts[open]>summary::after,
      .case-detail .brief[open]>summary::after {
        content: "−"
      }

      .case-detail .brief {
        gap: 14px
      }

      .case-detail .brief>summary h2 {
        font-size: 1.25rem
      }

      .case-detail .chapter>summary {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        margin: 0;
        padding-right: 28px;
        cursor: pointer;
        list-style: none
      }

      .case-detail .chapter>summary::after {
        content: "+";
        position: absolute;
        top: 2px;
        right: 0;
        color: var(--brand);
        font: 500 1.35rem/1 var(--sans)
      }

      .case-detail .chapter[open]>summary {
        margin-bottom: 16px
      }

      .case-detail .chapter[open]>summary::after {
        content: "−"
      }

      .case-detail .chapter>summary .sec-h {
        min-width: 0
      }

    }

    /* ===== Atlas & journey: clean result tiles, client card, map popups, journey rail and journey line ===== */
    .metric {
      display: grid;
      gap: 5px;
      align-content: start;
      min-width: 0;
      margin: 0;
      padding: 12px 14px 13px;
      border-radius: 14px;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(61, 39, 102, .1)
    }

    .metric b {
      font: 600 clamp(1.1rem, 1.5vw, 1.32rem)/1.1 var(--sans);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.01em;
      color: var(--brand)
    }

    .metric span {
      font: 500 .84rem/1.35 var(--sans);
      color: var(--ink)
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none
    }

    /* Overall impact strip */
    .overall {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      list-style: none;
      padding: 0
    }

    .overall .metric {
      padding: 16px 16px 18px;
      background: rgba(255, 255, 255, .82);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease)
    }

    .overall .metric b {
      font-size: clamp(1.25rem, 1.8vw, 1.55rem)
    }

    @media (hover:hover) {
      .overall .metric:hover {
        transform: translateY(-3px);
        box-shadow: inset 0 0 0 1px rgba(61, 39, 102, .14), 0 14px 30px -22px rgba(31, 26, 64, .5)
      }

    }

    /* Case page result grids */
    .case-quick-results.metrics {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 0;
      border: 0
    }

    .slabs.metrics {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px
    }

    .case-detail .brief-data .metric {
      padding: 10px 12px
    }

    .fd-item .metric {
      padding: 10px 12px;
      background: var(--gold-soft);
      box-shadow: none
    }

    /* Team mix: one slim bar with a readable legend */
    .mix {
      display: grid;
      gap: 8px
    }

    .mix>.label {
      color: var(--ink-2)
    }

    .mix-bar {
      display: flex;
      gap: 3px;
      height: 8px;
      overflow: hidden;
      border-radius: 999px
    }

    .mix-bar i {
      background: var(--c);
      border-radius: 999px
    }

    .mix-lg {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin: 0;
      padding: 0;
      list-style: none;
      font: 500 .82rem/1.3 var(--sans);
      color: var(--ink-2)
    }

    .mix-lg li {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .mix-lg i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c)
    }

    .mix-lg b {
      color: var(--ink)
    }

    .case-detail .facts .mix>.label {
      display: none
    }

    .case-detail .facts .mix-lg,
    .case-detail .facts .mix-lg b {
      color: #fff
    }

    .case-detail .facts .deploy {
      display: grid;
      gap: 10px
    }

    .case-detail .facts {
      align-self: start;
      align-content: start
    }

    /* Client card */
    .atlas-copy {
      display: none
    }

    /* A one- or two-client sector still gets a full screen of map to scroll through. */
    .case-workbench {
      min-height: max(calc(var(--case-count) * 560px), 150svh)
    }

    .landscape-client-slot {
      padding: 20px clamp(24px, 5vw, 80px) 20px max(84px, 5vw)
    }

    .case-landscape.is-reversed .landscape-client-slot {
      padding: 20px max(24px, 5vw) 20px clamp(84px, 5vw, 80px)
    }

    .cc {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(440px, 100%);
      max-height: calc(100% - 20px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      padding: clamp(18px, 2vw, 26px);
      border-radius: 24px;
      background: rgba(255, 255, 255, .93);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .08), 0 28px 60px -32px rgba(31, 26, 64, .5);
      pointer-events: auto
    }

    .cc>* {
      flex-shrink: 0
    }

    .cc::before {
      content: "";
      position: absolute;
      left: 26px;
      right: 26px;
      top: 0;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--tc)
    }

    .cc-head {
      display: grid;
      gap: 9px
    }

    .cc-logos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
      min-height: 30px
    }

    .cc-logos img {
      width: auto;
      height: 30px;
      max-width: 128px;
      object-fit: contain
    }

    /* Logo and name lockup: a fixed frame keeps every logo shape on the same baseline. */
    .cc-id.has-logo {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 14px
    }

    /* Logos sit bare beside the name: no frame, a fixed box only so every shape aligns the same way. */
    .cc-logo {
      display: grid;
      place-items: center start;
      width: 72px;
      height: 40px;
      overflow: hidden;
      opacity: .9
    }

    .cc-logo img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain
    }

    /* This file carries wide built-in margins; crop into them so the mark reads at the same size as the others. */
    .cc-logo img[src$="Mitsubridge_logo_white.png"] {
      max-width: none;
      max-height: none;
      width: 132%;
      margin-left: -16%
    }

    .cc-id.has-logo h3 {
      font-size: clamp(1.3rem, 1.9vw, 1.7rem)
    }

    /* Results: the label is the readable part; the value is a compact tag beside it. */
    .cc-results {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line)
    }

    .cc-results li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 42px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line)
    }

    .cc-results span {
      font: 500 .95rem/1.35 var(--sans);
      color: var(--ink)
    }

    .cc-results b {
      flex: none;
      padding: 3px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tc) 11%, #fff);
      font: 700 .84rem/1.3 var(--sans);
      font-variant-numeric: tabular-nums;
      color: var(--brand)
    }

    /* Team deployment: label and legend on one line, proportional bar beneath. */
    .cc-team {
      display: grid;
      gap: 8px
    }

    .cc-team-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: baseline;
      gap: 4px 12px
    }

    .cc-team-head>span {
      font: 600 .82rem/1.3 var(--sans);
      color: var(--ink-2)
    }

    .cc-team-head ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px 10px;
      margin: 0;
      padding: 0;
      list-style: none
    }

    .cc-team-head li {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 500 .82rem/1.3 var(--sans);
      color: var(--ink-2)
    }

    .cc-team-head li i {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--c)
    }

    .cc-team-head li b {
      font-weight: 700;
      color: var(--ink)
    }

    .cc-team-bar {
      display: flex;
      gap: 3px;
      height: 6px
    }

    .cc-team-bar i {
      border-radius: 999px;
      background: var(--c)
    }

    .cc-feat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: max-content;
      font: 600 .75rem/1 var(--sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--gold-text)
    }

    .cc-feat svg {
      width: 14px;
      height: 14px
    }

    .cc h3 {
      margin: 0;
      font: 400 clamp(1.4rem, 2.1vw, 1.85rem)/1.1 var(--display);
      letter-spacing: -.02em;
      color: var(--ink);
      overflow-wrap: anywhere
    }

    .cc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0
    }

    .cc-sector,
    .cc-loc {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font: 500 .78rem/1.2 var(--sans)
    }

    .cc-sector {
      background: color-mix(in srgb, var(--tc) 9%, #fff);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 22%, transparent);
      color: var(--ink)
    }

    .cc-sector i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--tc)
    }

    .cc-loc {
      background: var(--gold-soft);
      color: var(--gold-text)
    }

    .cc-loc svg {
      flex: none;
      width: 14px;
      height: 14px
    }

    .cc-story {
      margin: 0;
      font: 400 1.04rem/1.45 var(--display);
      color: var(--ink-2)
    }

    .cc-soon {
      margin: 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--well);
      font-size: .88rem;
      color: var(--ink-2)
    }

    .cc-more {
      border-top: 1px solid var(--line)
    }

    .cc-more>summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      cursor: pointer;
      list-style: none;
      font: 600 .88rem/1 var(--sans);
      color: var(--ink)
    }

    .cc-more>summary::-webkit-details-marker {
      display: none
    }

    .cc-more>summary::after {
      content: "";
      width: 9px;
      height: 9px;
      margin-right: 4px;
      border-right: 2px solid var(--brand);
      border-bottom: 2px solid var(--brand);
      transform: translateY(-3px) rotate(45deg);
      transition: transform .25s var(--ease)
    }

    .cc-more[open]>summary::after {
      transform: translateY(2px) rotate(-135deg)
    }

    .cc-more dl {
      display: grid;
      gap: 10px;
      margin: 2px 0 12px
    }

    .cc-more dt {
      font: 600 .75rem/1.2 var(--sans);
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--ink-2)
    }

    .cc-more dd {
      margin: 3px 0 0;
      font-size: .9rem;
      line-height: 1.45;
      color: var(--ink)
    }

    .cc-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
      padding: 0;
      list-style: none
    }

    .cc-tags li {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--well);
      font-size: .78rem;
      color: var(--ink-2)
    }

    .cc-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      padding-top: 2px
    }

    .cc-next {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 4px;
      border: 0;
      background: none;
      color: var(--brand);
      font: 600 .88rem/1 var(--sans);
      cursor: pointer
    }

    .cc-next svg {
      width: 16px;
      height: 16px;
      transition: transform .25s var(--ease)
    }

    .cc-next:hover svg {
      transform: translateY(2px)
    }

    .cc-next[data-jump]:hover svg {
      transform: translateX(3px)
    }

    /* Map pins, labels and photo popups */
    .atlas-pin-wrap {
      background: var(--brand);
      box-shadow: 0 0 0 0 rgba(61, 39, 102, .45), 0 3px 10px rgba(20, 29, 44, .35)
    }

    .atlas-pin-wrap i {
      background: var(--gold)
    }

    .atlas-pin-secondary {
      display: block;
      box-sizing: border-box;
      width: 16px;
      height: 16px;
      background: var(--brand-2)
    }

    @media (prefers-reduced-motion:no-preference) {
      .atlas-pin-wrap {
        animation: pin-pulse 2.4s ease-out infinite
      }

    }

    @keyframes pin-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(61, 39, 102, .4), 0 3px 10px rgba(20, 29, 44, .35)
      }

      70%,
      100% {
        box-shadow: 0 0 0 14px rgba(61, 39, 102, 0), 0 3px 10px rgba(20, 29, 44, .35)
      }

    }

    .pp {
      width: clamp(280px, 34vw, 520px)
    }

    .pp-media {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #efedf4
    }

    .pp-track {
      display: flex;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      overscroll-behavior-x: contain
    }

    .pp-track::-webkit-scrollbar {
      display: none
    }

    .pp-slide {
      position: relative;
      flex: 0 0 100%;
      height: 100%;
      margin: 0;
      scroll-snap-align: start
    }

    .pp-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .pp-slide figcaption {
      position: absolute;
      inset: auto 0 0;
      padding: 26px 12px 9px;
      background: linear-gradient(transparent, rgba(18, 12, 34, .82));
      font: 500 .75rem/1.3 var(--sans);
      color: #fff
    }

    .pp-slide figcaption a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px
    }

    /* Credit links are tap targets too: at least 24px tall (WCAG 2.5.8, the minimum UI/UX Pro Max lists for web). */
    .pp-slide figcaption a,
    .pp-cap a {
      display: inline-block;
      min-height: 24px;
      padding: 4px 0;
      line-height: 16px
    }

    .pp-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 22px;
      background: #fff
    }

    .pp-logo img {
      width: auto;
      height: auto;
      max-width: 72%;
      max-height: 70px;
      object-fit: contain
    }

    .pp-logo:has(img + img) img {
      max-width: 28%
    }

    .pp-empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--brand-2)
    }

    .pp-empty svg {
      width: 34px;
      height: 34px
    }

    .pp-nav {
      position: absolute;
      top: 50%;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-top: -22px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      cursor: pointer
    }

    .pp-nav::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 4px 12px -4px rgba(20, 29, 44, .45);
      transition: transform .2s var(--ease)
    }

    .pp-nav:hover::before {
      transform: scale(1.08)
    }

    .pp-nav svg {
      position: relative;
      width: 15px;
      height: 15px
    }

    .pp-nav.prev {
      left: 2px
    }

    .pp-nav.next {
      right: 2px
    }

    .pp-nav:disabled {
      opacity: 0;
      pointer-events: none
    }

    .pp-dots {
      position: absolute;
      top: 10px;
      left: 12px;
      display: flex;
      gap: 5px
    }

    .pp-dots i {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .6);
      box-shadow: 0 0 0 1px rgba(20, 29, 44, .2);
      transition: width .25s var(--ease), background .25s
    }

    .pp-dots i.on {
      width: 16px;
      background: #fff
    }

    .pp-cap {
      display: grid;
      gap: 3px;
      padding: 11px 14px 13px
    }

    .pp-cap strong {
      font: 600 .95rem/1.25 var(--sans);
      color: var(--ink)
    }

    .pp-cap span,
    .pp-cap small {
      font-size: .8rem;
      line-height: 1.35;
      color: var(--ink-2);
      overflow-wrap: anywhere
    }

    /* Journey rail: collapsed dots at the left edge, the full sector and client list on hover, focus or tap */
    .jr {
      position: fixed;
      left: 16px;
      top: 50%;
      z-index: 60;
      display: grid;
      justify-items: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-10px, -50%);
      transition: opacity .3s var(--ease), transform .3s var(--ease), visibility 0s .3s
    }

    .jr.on {
      opacity: 1;
      visibility: visible;
      transform: translate(0, -50%);
      transition: opacity .3s var(--ease), transform .3s var(--ease)
    }

    .jr-toggle {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .1), 0 10px 24px -12px rgba(31, 26, 64, .5);
      color: var(--brand);
      cursor: pointer
    }

    .jr-toggle svg {
      width: 20px;
      height: 20px
    }

    .jr-toggle span {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%)
    }

    .jr-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      margin: 0;
      padding: 10px 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .08);
      list-style: none;
      width: 22px
    }

    .jr-track li {
      width: 7px;
      height: 7px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--tc) 40%, #fff);
      transition: height .3s var(--ease), background .3s
    }

    .jr-track li.on {
      height: 22px;
      background: var(--tc)
    }

    .jr-panel {
      position: absolute;
      left: 0;
      top: 50%;
      width: min(310px, calc(100vw - 32px));
      max-height: min(76vh, 640px);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 16px 14px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .97);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .08), 0 30px 60px -28px rgba(31, 26, 64, .55);
      opacity: 0;
      visibility: hidden;
      transform: translate(-8px, -50%);
      transition: opacity .22s var(--ease), transform .22s var(--ease), visibility 0s .22s
    }

    .jr.open .jr-panel,

    }

    @media (hover:hover) and (min-width:901px) {
      .jr:hover .jr-panel {

        visibility: visible;
        transform: translate(0, -50%);
        transition: opacity .22s var(--ease), transform .22s var(--ease)
      }

    .jr-title {
      margin: 0 6px 10px;
      font: 600 .75rem/1.2 var(--sans);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-2)
    }

    .jr-group+.jr-group {

      padding-top: 6px;
      border-top: 1px solid var(--line)
    }

    .jr-group ul {
      margin: 0;
      padding: 0 0 0 18px;
      list-style: none
    }

    .jr-sector,
    .jr-client {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      padding: 6px 8px;
      border: 0;
      border-radius: 10px;
      background: none;
      text-align: left;
      cursor: pointer;
      transition: background .2s
    }

    .jr-sector {
      font: 600 .88rem/1.25 var(--sans);
      color: var(--ink)
    }

    .jr-sector i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tc)
    }

    .jr-client {
      font: 500 .84rem/1.3 var(--sans);
      color: var(--ink-2)
    }

    .jr-sector:hover,
    .jr-client:hover {
      background: var(--well)
    }

    .jr-client[aria-current] {
      background: color-mix(in srgb, var(--tc) 12%, #fff);
      color: var(--ink);
      font-weight: 600
    }

    /* Journey line and stops on the listing */
    .wrap.journey {
      position: relative
    }

    /* The route sits under the sections: it shows in gutters and gaps and passes behind cards, images and the map. */
    .jpath {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none
    }

    .wrap.journey>section {
      position: relative;
      z-index: 1
    }

    .jp-track {
      fill: none;
      stroke: rgba(61, 39, 102, .3);
      stroke-width: 2.5;
      stroke-dasharray: 1 8;
      stroke-linecap: round
    }

    .jp-draw {
      fill: none;
      stroke: url(#jpGrad);
      stroke-width: 3.5;
      stroke-linecap: round
    }

    .jp-stops circle {
      fill: #fff;
      stroke: rgba(61, 39, 102, .28);
      stroke-width: 2;
      transition: fill .4s var(--ease), stroke .4s var(--ease), stroke-width .4s var(--ease)
    }

    .jp-stops circle.on {
      fill: var(--gold);
      stroke: rgba(201, 164, 58, .3);
      stroke-width: 6
    }

    .jp-head {
      fill: var(--gold);
      stroke: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(201, 164, 58, .9))
    }

    /* Translucent frosted cards so the route reads through them as it passes behind. */
    .wrap.journey .hero.list-hero {
      background: radial-gradient(48% 90% at 0% 100%, rgba(201, 164, 58, .1), transparent 72%), radial-gradient(50% 90% at 100% 0%, rgba(108, 85, 166, .1), transparent 68%), rgba(255, 255, 255, .58);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px)
    }

    .wrap.journey .proof-section {
      background: rgba(255, 255, 255, .5);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px)
    }

    .wrap.journey .finder {
      background: linear-gradient(165deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .5));
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px)
    }

    .wrap.journey .finder .prompt {
      background: rgba(232, 234, 241, .6)
    }

    .wrap.journey .overall .metric,
    .wrap.journey .ins li {
      background: rgba(255, 255, 255, .62);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px)
    }

    .wrap.journey .vframe {
      background: linear-gradient(150deg, rgba(244, 243, 248, .62), rgba(236, 233, 244, .5))
    }

    /* Case page: story index with scroll-spy and a progress line */
    .case-detail .chapter-nav a.on {
      background: color-mix(in srgb, var(--brand) 8%, #fff);
      color: var(--brand);
      font-weight: 600
    }

    .case-detail .chapter-nav a.on span {
      color: var(--gold-text)
    }

    .cn-fill {
      display: none
    }

    @media (min-width:1101px) {
      .case-detail .chapter-nav {
        position: relative;
        padding-left: 14px
      }

      .case-detail .chapter-nav::before,
      .cn-fill {
        content: "";
        position: absolute;
        left: 4px;
        top: 14px;
        bottom: 14px;
        width: 2px;
        border-radius: 2px
      }

      .case-detail .chapter-nav::before {
        background: rgba(61, 39, 102, .1)
      }

      .cn-fill {
        display: block;
        background: linear-gradient(var(--gold), var(--brand-2));

      }

    }

    @media (max-width:1100px) {
      .overall {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

    }

    @media (max-width:900px) {
      .landscape-client-slot,
      .case-landscape.is-reversed .landscape-client-slot {
        align-items: flex-end;
        justify-content: center;
        padding: 12px
      }

      .cc {
        width: min(560px, 100%);
        max-height: min(58svh, calc(100% - 12px));
        gap: 12px;
        border-radius: 20px
      }

      .jr {
        top: calc(var(--atlas-sticky-top) + 12px);
        left: 12px;
        transform: translateY(-6px)
      }

      .jr.on {
        transform: none
      }

      .jr-track {
        display: none
      }

      .jr-toggle {
        width: auto;
        height: 44px;
        padding: 0 16px 0 12px;
        border-radius: 999px;
        display: flex;
        gap: 8px;
        font: 600 .85rem/1 var(--sans)
      }

      .jr-toggle span {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
        clip-path: none
      }

      .jr-panel {
        position: fixed;
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 10px;
        width: auto;
        max-height: 68svh;
        transform: translateY(16px)
      }

      .jr.open .jr-panel,
      .jr:has(:focus-visible) .jr-panel {
        transform: none
      }

      .case-quick-results.metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

    }

    @media (max-width:640px) {
      .overall {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .cc {
        gap: 10px;
        padding: 14px 14px 0;
        max-height: min(64svh, calc(100% - 12px))
      }

      .cc-head {
        gap: 6px
      }

      .cc-logos img {
        height: 24px
      }

      .cc-id.has-logo {
        gap: 12px
      }

      .cc-logo {
        width: 60px;
        height: 34px
      }

      .cc-results li {
        min-height: 38px;
        padding: 6px 0
      }

      .cc-results span {
        font-size: .9rem
      }

      .cc h3 {
        font-size: 1.3rem
      }

      .cc-story {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: .94rem
      }

      .metric {
        gap: 3px;
        padding: 8px 10px
      }

      .metric b {
        font-size: 1.05rem
      }

      .metric span {
        font-size: .78rem
      }

      /* Keep the call to action in reach while the card scrolls. */
      .cc-actions {
        position: sticky;
        bottom: 0;
        margin: 0 -14px;
        padding: 10px 14px 14px;
        background: linear-gradient(rgba(255, 255, 255, 0), #fff 28%)
      }

      .case-quick-results.metrics {
        grid-template-columns: 1fr
      }

      .jp-draw {
        stroke-width: 2
      }

      .jp-stops circle {
        r: 4.5px
      }

    }

    @media (max-width:420px) {
      .metrics {
        gap: 6px
      }

      .cc-actions .btn {
        flex: 1 1 100%;
        justify-content: center
      }

    }

    /* Test-only style picker (?mapstyle) */
    .map-style-picker {
      position: absolute;
      right: 16px;
      bottom: 40px;
      z-index: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 10px 24px -12px rgba(31, 26, 64, .5);
      font: 600 .8rem/1 var(--sans);
      color: var(--ink)
    }

    @media (max-width:900px) {
      .map-style-picker {
        top: calc(var(--atlas-sticky-top) + 12px);
        right: 12px;
        bottom: auto
      }
    }

    .map-style-picker label {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .map-style-picker .msp-names {
      min-height: 36px;
      padding: 0 10px 0 4px;
      border-left: 1px solid var(--line);
      font-weight: 500;
      cursor: pointer
    }

    .map-style-picker input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--brand)
    }

    .map-style-picker select {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font: 500 .82rem var(--sans);
      color: var(--ink)
    }


    /* On-map journey route: a gold line that draws itself into the pins once the map has settled. */
    .groute {
      position: absolute;
      pointer-events: none
    }

    .groute svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .gr-track {
      fill: none;
      stroke: rgba(255, 255, 255, .45);
      stroke-width: 2.5;
      stroke-dasharray: 1 8;
      stroke-linecap: round
    }

    .gr-draw {
      fill: none;
      stroke: #d6b24a;
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(20, 14, 38, .55))
    }

    .gr-head {
      fill: var(--gold);
      stroke: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(201, 164, 58, .9))
    }

    /* Back to top: a round button bottom-right, faded in once the reader is a screen down. */
    .to-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 16px 0 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .08), 0 12px 28px -14px rgba(31, 26, 64, .5);
      font: 600 .85rem/1 var(--sans);
      color: var(--brand);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity .25s var(--ease), transform .25s var(--ease), visibility 0s .25s
    }

    .to-top.on {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s var(--ease), transform .25s var(--ease)
    }

    .to-top svg {
      width: 18px;
      height: 18px;
      transform: rotate(180deg)
    }

    .to-top:hover {
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .14), 0 16px 32px -14px rgba(31, 26, 64, .55)
    }

    .jr-top {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      margin: -4px 0 8px;
      padding: 6px 8px;
      border: 0;
      border-radius: 10px;
      background: var(--well);
      font: 600 .84rem/1.2 var(--sans);
      color: var(--brand);
      cursor: pointer
    }

    .jr-top svg {
      width: 16px;
      height: 16px;
      transform: rotate(180deg)
    }

    /* Case pages: previous and next study, side by side. */
    .case-pager {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: clamp(32px, 5vw, 56px) 0 0
    }

    .case-pager a {
      display: grid;
      gap: 6px;
      min-height: 44px;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .08), 0 14px 30px -24px rgba(31, 26, 64, .5);
      text-decoration: none;
      color: var(--ink);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease)
    }

    .case-pager a:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(61, 39, 102, .12), 0 18px 34px -22px rgba(31, 26, 64, .55)
    }

    .case-pager .cp-next {
      text-align: right
    }

    .case-pager span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 .78rem/1 var(--sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--ink-2)
    }

    .case-pager .cp-next span {
      justify-content: flex-end
    }

    .case-pager span svg {
      width: 14px;
      height: 14px
    }

    .case-pager b {
      font: 400 1.15rem/1.25 var(--display)
    }

    @media (max-width:640px) {
      .case-pager {
        grid-template-columns: 1fr
      }

      .to-top {
        right: 14px;
        bottom: 14px
      }
    }

    /* The map is slightly see-through so the journey line reads behind it: only Google's tile layer fades. */
    .case-landscape,
    .atlas-live-slot .atlas-map,
    .atlas-map {
      background: transparent
    }

    .atlas-map .gtiles {
      opacity: .82
    }

    /* Focus veil: gentle blur and dim outside the circles around the active pins (the mask is set in JS). */
    .gfocus {
      position: absolute;
      pointer-events: none;
      background: rgba(16, 12, 30, .02);
      -webkit-backdrop-filter: blur(.35px) saturate(.98);
      backdrop-filter: blur(.35px) saturate(.98);
      mask-composite: intersect;
      -webkit-mask-composite: source-in
    }

    /* Google Maps overlays: branded pins with place labels, and the photo card */
    .gpin,
    .gphoto {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0
    }

    .gpin-btn {
      position: absolute;
      left: -22px;
      top: -22px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer
    }

    .gpin-btn:hover .atlas-pin-wrap,
    .gpin-btn:hover .atlas-pin-secondary {
      transform: scale(1.12)
    }

    .gpin-btn:hover .atlas-pin-wrap {
      transform: rotate(-45deg) scale(1.12)
    }

    .atlas-pin-wrap,
    .atlas-pin-secondary {
      transition: transform .2s var(--ease)
    }

    .gpin-label {
      position: absolute;
      left: 16px;
      top: -13px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 4px 14px -4px rgba(20, 29, 44, .35);
      font: 600 12px/1.2 var(--sans);
      color: var(--ink);
      white-space: nowrap;
      pointer-events: none
    }

    .gpin.main .gpin-label {
      left: 20px
    }

    .gpin.open .gpin-label {
      opacity: 0
    }

    .gphoto {
      z-index: 2
    }

    .gphoto-in {
      position: absolute;
      left: 0;
      bottom: 26px;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 50px -20px rgba(20, 29, 44, .55), 0 0 0 1px rgba(61, 39, 102, .06);
      transform: translateX(-50%)
    }

    @media (prefers-reduced-motion:no-preference) {
      .gphoto-in {
        animation: gphoto-in .32s cubic-bezier(.22, 1, .36, 1) both
      }

    }

    @keyframes gphoto-in {
      from {
        opacity: 0;
        transform: translate(-50%, 10px) scale(.97)
      }

    }

    .gphoto-x {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      cursor: pointer
    }

    .gphoto-x::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 4px 12px -4px rgba(20, 29, 44, .45)
    }

    .gphoto-x svg {
      position: relative;
      width: 14px;
      height: 14px
    }

    /* Spotlight: a soft halo marks the active place on any map style, including busy satellite imagery. */
    .gpin.main::before {
      content: "";
      position: absolute;
      left: -70px;
      top: -70px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 164, 58, .42) 0, rgba(201, 164, 58, .16) 38%, rgba(201, 164, 58, 0) 70%);
      pointer-events: none
    }

    @media (prefers-reduced-motion:no-preference) {
      .gpin.main::before {
        animation: spot 3.2s ease-in-out infinite
      }

    }

    @keyframes spot {
      50% {
        transform: scale(1.12);
        opacity: .75
      }

    }

    /* Keep Google's logo and Terms link (bottom corners) clear of the client card. */
    .landscape-client-slot,
    .case-landscape.is-reversed .landscape-client-slot {
      padding-bottom: 40px
    }

    /* Hero: a light panel of client logos drifting in three columns, fading out at top and bottom. */
    .hero-art.hero-logos {
      display: block;
      min-height: 460px;
      overflow: hidden;
      border: 0;
      border-radius: 28px;
      background: radial-gradient(70% 60% at 80% 10%, rgba(201, 164, 58, .14), transparent 70%), linear-gradient(165deg, #f7f4fb, #ebe5f4);
      box-shadow: inset 0 0 0 1px rgba(61, 39, 102, .06);
      transform: none;
      perspective: 1200px
    }

    .logo-wall {
      position: absolute;
      inset: 0 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 80%, transparent);
      mask-image: linear-gradient(transparent, #000 14%, #000 80%, transparent);
      transform: rotateX(calc(var(--rx, 0deg) * .4)) rotateY(calc(var(--ry, 0deg) * .4));
      transition: transform .5s var(--ease)
    }

    .lw-col {
      min-width: 0;
      overflow: hidden
    }

    .lw-track {
      margin: 0;
      padding: 0;
      list-style: none
    }

    @media (prefers-reduced-motion:no-preference) {
      .lw-track {
        animation: lw-drift var(--lw-d, 46s) linear infinite;
        animation-delay: var(--lw-delay, 0s)
      }

      .lw-col:nth-child(2) .lw-track {
        animation-direction: reverse
      }
    }

    /* Each track holds its set twice, so moving by half its height loops seamlessly. */
    @keyframes lw-drift {
      to {
        transform: translateY(-50%)
      }
    }

    .logo-wall:hover .lw-track,
    .logo-wall:focus-within .lw-track,
    .logo-wall.paused .lw-track {
      animation-play-state: paused
    }

    .lw-track li {
      padding-bottom: 14px
    }

    .lw-tile {

      display: grid;
      place-items: center;

      padding: 18px 16px 24px;
      border-radius: 20px;
      background: #fff;

    }

      box-shadow: 0 20px 40px -22px rgba(31, 26, 64, .55)
    }

    .lw-tile:hover .lw-name,
    .lw-tile:focus-visible .lw-name {

      transform: none
    }

    .lw-caption {

      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 20px -14px rgba(31, 26, 64, .45);
      font: 500 .78rem/1.3 var(--sans);
      color: var(--ink-2);

      transform: translateX(-50%)
    }

    /* Hero copy: the closing line becomes soft chips instead of dot-separated text. */
    .list-hero .hero-index {
      gap: 8px;
      margin-top: 28px;
      color: var(--ink-2)
    }

    .list-hero .hero-index span {
      padding: 6px 12px;

const DET=[{"id": "avantika", "s": "AU", "name": "Avantika University", "loc": "Ujjain, Madhya Pradesh", "tags": ["Admissions", "Walk-ins", "Conversion", "Referrals"], "headline": "From a design-led name to a full-spectrum university: 26% more admissions, 38% more in non-design programmes", "sub": "How a young university with a strong design identity widened its admissions beyond design, against long-established local competition.", "snap": [["Institution", "Young private university"], ["Known for", "Design programmes"], ["Our focus", "Non-design programmes, applications, walk-ins, PhD seats"], ["Team", "Elite, Prime and Alpha sales experts"]], "tiles": [["+26%", "Overall admissions"], ["+38%", "Non-design programme admissions"], ["+56%", "Applications"], ["+32%", "Walk-ins"], ["+43%", "Conversion rate"], ["+52%", "Referral admissions"], ["100%", "PhD seats filled"]], "chIntro": "Avantika had the hardest kind of problem for a growing university: a strong reputation in one corner, and quiet in every other.", "ch": [["A great design name, a small voice everywhere else", "Avantika had already built a name in design education. Its other programmes had far less awareness, so families who loved the campus were not hearing about everything else it offers."], ["Older, better-known local universities", "In its region, families trust names they have known for decades. A younger university has to earn the same trust faster, one conversation at a time."], ["Enquiries that did not become applications", "Interest was spread across many programmes, and each programme needs a different pitch, a different comparison and a different follow-up. A single generic script could not carry that."]], "apIntro": "We did not add more calls. We changed what every call said, who said it and what happened next.", "ap": [["Programme-by-programme pitch", "Our sales experts were briefed separately on each non-design programme: who it is for, what makes it different from the local alternatives, and the questions parents ask before they commit."], ["Nurture, then close", "Prime sales experts followed up with every enquiry on a schedule, building the case and moving prospects to an application. Alpha sales experts took warm, high-intent prospects through objections to a confirmed admission."], ["Walk-ins as the closing moment", "Serious prospects were invited to see the campus. Visits are where Avantika sells best, so we made a visit the next step for every qualified family."], ["A focused push on PhD seats", "A dedicated outreach to research aspirants, with the same follow-up discipline, took doctoral seats to 100% filled."], ["Referrals from happy admissions", "Once families joined, regular check-ins kept them engaged, and their recommendations began to bring in new students."]], "insight": {"t": "Why the 38% matters", "x": "Growth in non-design programmes (38%) was higher than overall growth (26%). The extra demand came from exactly the programmes that had been under-promoted. The gap was awareness, not quality, and a dedicated sales team closed it."}, "why": ["Programme-specific pitches replaced a one-size script", "Follow-up never stopped between enquiry and application", "Every qualified family was invited to the campus", "Referrals turned happy students into a growth channel"]}, {"id": "acsc", "s": "ACSC", "name": "MIT Arts, Commerce & Science College", "loc": "Alandi, Pune", "tags": ["Direct conversion", "Speed to lead", "Walk-ins", "Paid applications"], "headline": "Every lead reached within 5 minutes: conversion up 60% and walk-ins up 116%", "sub": "How a college with a flood of enquiries and too few hands to answer them turned speed into admissions, with Apex Mind accountable for direct conversion.", "snap": [["Institution", "Arts, Commerce and Science college, MIT Group"], ["Programmes", "UG and PG, many streams"], ["Our role", "Direct conversion owner"], ["Team", "Elite and Alpha sales experts, daily reporting"]], "tiles": [["+60%", "Conversion"], ["+116%", "Walk-ins"], ["+65%", "Paid applications"], ["42%", "Contribution to overall admissions"], ["< 5 min", "Average time to first response"]], "chIntro": "The college did not have a lead problem. It had a response problem.", "ch": [["Too many leads, too few people", "Lead volume was very high, but there were not enough people to attend to each one. In a short admission window, a lead that waits goes cold, and the next college calls first."], ["A direct conversion responsibility", "Apex Mind was not asked only to make calls. We owned the result: moving enquiries all the way to paid applications and admissions."], ["Many programmes in a short window", "UG and PG streams each need different guidance, and families compare options quickly. Every lost day was a lost admission."]], "apIntro": "We built the team around the lead volume, so that no lead waits for an answer.", "ap": [["A team sized to the volume", "We deployed enough sales experts to reach every lead, instead of asking a thin team to prioritise and drop. The target was simple: every new lead attended on time."], ["First response inside 5 minutes", "A speed-to-lead rule backed by the CRM: new leads reach a sales expert within minutes, with the average first response held within 5 minutes."], ["Qualify at scale, close with experience", "Elite sales experts qualified enquiries quickly, followed up on a set schedule and invited families to walk in. Alpha sales experts took warm prospects through objections to a paid application and admission."], ["Paid applications as the milestone", "Each sales expert worked towards a paid application, the strongest signal that a family is serious, then supported them through to admission."], ["Daily reporting", "Leads attended, follow-ups due, walk-ins booked and applications paid were reported every day, so problems were fixed within a day, not at the end of the season."]], "insight": {"t": "Why 5 minutes", "x": "A widely cited lead-response study led by Prof. James Oldroyd (MIT) with InsideSales.com found that the odds of qualifying a lead were 21 times higher when it was called within 5 minutes than after 30 minutes, and the odds of simply reaching the lead were 100 times higher. For an admission season measured in weeks, minutes decide who the family talks to.", "src": "Source: Oldroyd / InsideSales.com Lead Response Management Study, as summarised at electronics-cooling.com"}, "why": ["Capacity matched to lead volume, so no lead was left waiting", "A 5-minute first-response standard enforced through the CRM", "Elite and Alpha roles split the work: qualify and follow up, then close", "Paid applications used as the milestone, not just calls"]}, {"id": "aoe", "s": "AOE", "name": "MIT Academy of Engineering", "loc": "Alandi, Pune", "tags": ["Cancellations", "CAP rounds", "Post-admission", "Design programmes"], "headline": "3,000+ fresh admissions, 64% fewer cancellations and 100% of the intake achieved", "sub": "How one of Maharashtra's most sought-after engineering institutes stopped admissions leaking out through CAP rounds, filled its design school and supported thousands of families after admission.", "snap": [["Institution", "Autonomous engineering institute, MIT Group"], ["Scale", "3,000+ fresh admissions this cycle"], ["Our focus", "High volume, cancellations, core branches, design school"], ["Team", "Alpha and Prime sales experts, plus a dedicated Elite post-admission team"]], "tiles": [["3,000+", "Fresh admissions"], ["-64%", "Cancellations"], ["100%", "Yearly intake achieved"], ["100%", "MIT School of Design seats filled"], ["+45%", "Revenue from applications"], ["+22%", "Application-to-admission conversion"], ["1.5 hrs", "Resolution turnaround time"]], "chIntro": "Being popular creates its own problems: huge volume, high expectations and a process where seats can walk away after you win them.", "ch": [["Cancellations during CAP rounds", "In the state's centralised admission process, a candidate can keep a seat while holding out for a better one. If a better allotment comes, the earlier seat is cancelled. A seat that is won in round one can be lost in round two."], ["Core branches that needed more explaining", "Programmes such as Mechanical, Electrical, Civil and Chemical had fewer admissions. Families needed to understand the scope, labs, careers and outcomes of each, before choosing."], ["A very high volume of enquiries", "One of the largest admission volumes in Maharashtra means thousands of parents and students asking similar and specific questions at once, on a deadline."], ["A new school to establish: MIT School of Design", "A newer school, unfamiliar to many families, needed awareness and a persuasive story to fill every seat."], ["Work that begins after the admission", "Document checks, CAP form filling, entrance-exam guidance, parent concerns and application fees all pile up at the same time."]], "apIntro": "We treated the admission as the middle of the journey, not the end. We protected every seat we won, and supported every family afterwards.", "ap": [["A cancellation-prevention playbook", "Alpha sales experts reached admitted families early, explained what each choice in the CAP process means, handled objections and kept families committed to the seat. This is where the 64% reduction in cancellations came from."], ["Programme-specific guidance for core branches", "Prime sales experts explained the scope, labs, careers and outcomes of the less-chosen branches, so families could choose them on facts, not rumours."], ["A separate Elite team after admission", "A dedicated Elite team helped with documentation, parent guidance, CAP round form filling, entrance-exam guidance and application-fee collection. Admissions staff were free to focus on the campus."], ["A focused push for MIT School of Design", "A dedicated awareness and follow-up effort for the School of Design, with its own pitch and its own targets, took it to 100% of its seats."], ["A 1.5-hour resolution standard", "Parent and student queries were resolved within an average of 1.5 hours, which kept families confident through a stressful process."]], "insight": {"t": "Why cancellations are the quiet cost", "x": "In the centralised process, a candidate can freeze a seat, slide to a better branch at the same college, or float to a better college, and the earlier seat is cancelled when an upgrade comes. Every cancellation is a seat that must be won again, in a shrinking window. Protecting a seat that has already been won is usually cheaper than winning a new one, which is why cancellations fell by 64%.", "src": "Source: MIT AOE, All About MHT CET CAP Rounds (mitaoe.ac.in)"}, "why": ["Early, human contact after allotment kept families committed", "Branch-level guidance gave core programmes a fair hearing", "A separate Elite team absorbed post-admission work", "Design and core programmes each had their own targeted effort"]}, {"id": "uom", "s": "UoM", "name": "University of Meghalaya", "loc": "Meghalaya", "tags": ["Regional reach", "Virtual meetings", "Referrals", "Design programmes"], "headline": "Reaching beyond the city: 22% more admissions, 42% more prospects and 55% more virtual meetings", "sub": "How a university far from the big metros built awareness, reached families outside its city and closed more admissions with regional-language experts and a two-team model.", "snap": [["Institution", "University in Meghalaya"], ["Starting point", "Only 15% of admissions from outside the city"], ["Our focus", "Awareness, regional reach, design programmes, closure"], ["Team", "Regional-language sales experts, separate awareness and Alpha closure teams"]], "tiles": [["+22%", "Overall admissions"], ["+15%", "Design programme admissions"], ["+42%", "Prospect generation"], ["+10%", "Walk-ins"], ["+55%", "Virtual meetings"], ["35%", "Admissions contribution from paid applications"], ["+19%", "Referral admissions"]], "chIntro": "The university had a place, a programme and a promise. It needed more families to hear about them.", "ch": [["Distance is a real barrier", "Away from the large metros, many families will not travel to find out. Only 15% of admissions were coming from outside the city."], ["Schemes and scholarships pull families locally", "Government schemes and scholarships attract the local crowd, and they shape how families compare their options."], ["Low awareness of the university", "Many students and parents outside the immediate area simply did not know the university, or what it offered."], ["Design programmes were almost unknown", "Awareness of the design programme was especially low, so it had a long way to go from curiosity to application."], ["Many languages, many conversations", "Trust is built in the family's own language. A generic, one-language approach would not reach the whole region."]], "apIntro": "We built two teams and one rule: speak to every family in the language they trust, and make the distance irrelevant.", "ap": [["The best regional-language sales experts", "We assigned sales experts who speak the languages of the region, so that conversations with parents felt local and personal."], ["Teams by programme", "Separate teams for different programmes meant every family spoke to an expert who knew their programme in depth, including the design programme."], ["Two teams, two jobs", "One team focused on awareness and building footfall. A second team, with Alpha members, focused only on closure. Each could be judged on a clear goal."], ["Virtual meetings to remove distance", "Families who could not visit were invited to virtual meetings with the university. Virtual meetings grew by 55%."], ["Honest answers on schemes and scholarships", "Questions on schemes and scholarships were answered upfront, so they did not become a silent reason to drop off."], ["Referrals from happy families", "Admitted students and parents were engaged after joining, and referral admissions grew by 19%."]], "insight": {"t": "Why 42% more prospects matters", "x": "Admissions grew by 22%, but prospect generation grew by 42%. The funnel is wider at the top than it was, which is what a university outside the metros needs: more families who now know it exists, and more to convert next year."}, "why": ["Regional-language experts made families feel at home", "Awareness and closure were separated into two accountable teams", "Virtual meetings removed the cost of distance", "Programme-specific teams gave the design programme its own voice"]}, {"id": "vgws", "s": "VGWS", "name": "MIT Vishwashanti Gurukul World School", "loc": "Pune, Maharashtra", "tags": ["School admissions", "Boarding", "Referrals", "Premium parents"], "headline": "Trust at a premium fee: admissions up 14% and boarding admissions up 11.5%", "sub": "How a premium IB school won the confidence of discerning parents, from India and across the world, with our most experienced sales experts.", "snap": [["Institution", "IB world school with boarding"], ["Audience", "High-net-worth and global families"], ["Our focus", "Admissions, boarding intake, referrals"], ["Team", "Top-tier sales experts with school-admissions experience"]], "tiles": [["+14%", "Admissions"], ["+11.5%", "Boarding admissions"], ["+26%", "Applications"], ["+7%", "Paid walk-ins"], ["+23%", "Referral growth"], ["< 3 min", "Lead response time"]], "chIntro": "Choosing a school is not a purchase. It is one of the biggest decisions a family makes, and these families have the means to choose anywhere.", "ch": [["A high admission fee", "A premium fee needs a premium conversation. Parents compare value, safety, outcomes and care, not only a brochure."], ["IB competing with ICSE and CBSE", "Parents weigh the IB against the more familiar ICSE and CBSE boards. The IB is often costlier and its benefits are less well known, so the case for it must be made clearly."], ["Leads from around the world", "Enquiries came from different countries and time zones, from families with different expectations and a low tolerance for delay."], ["Boarding intake needed to grow", "Boarding is a deeper commitment than a day school. Parents need to trust the school with their child's daily life."], ["High-net-worth parents", "These families are well informed, busy and used to excellent service. A rehearsed script does not work with them."]], "apIntro": "We put our most experienced people on this account, and trained them to advise, not to sell.", "ap": [["The top-class experts", "We deployed the strongest sales experts on the team, including those with direct school-admissions experience, who speak the language of parents."], ["A consultative approach", "Conversations focused on the child, the family's goals and the right fit, not on pushing a seat. Parents were guided through the IB, its approach and boarding life."], ["Under 3 minutes to respond", "Every lead was attended within 3 minutes on average, which signals to a premium family that the school is attentive."], ["Campus visits that convert", "Families were invited to walk the campus, meet the school and see boarding for themselves. Paid walk-ins grew by 7%."], ["A referral loop", "Satisfied parents were kept in touch, and their recommendations became a trusted source of new families. Referral growth was 23%."]], "insight": {"t": "Why trust beats speed alone", "x": "For a premium school, speed opens the door but trust fills the seat. Quick replies (under 3 minutes) showed the school was attentive. Experienced sales experts then gave families the confidence to apply, visit and join, and to recommend the school to others.", "src": "Context: The Ken reports that the IB costs at least three times as much as ICSE or CBSE in India, and is concentrated in the metros (the-ken.com)"}, "why": ["Our most experienced experts, with school-admissions backgrounds", "Advice first, selling second", "Replies in under 3 minutes for every lead", "Campus visits and referrals built lasting trust"]}];

    /* Team deployment for the card: label and legend share one line, the proportional bar sits under them. */

    /* Client card in the atlas: name, story line and results up front; programme details and tags tucked into a disclosure. */
    function landscapeCard(c) {

    /* Story finder scoring: tags weigh most, then headline and result labels, then approach text. */
    function match(c, kws) {
      const d = c.d, tiles = tilesOf(c);
      const F = [[c.tags.join(" | "), 3], [c.head || "", 2], [tiles.map(t => t[0] + " " + t[1]).join(" | "), 2], [d ? [d.apIntro, ...d.ap.flat(), ...d.why].join(" ") : "", 1]].map(([s, w]) => [s.toLowerCase(), w]);
      let score = 0; const hits = [];
      kws.forEach(k => { let s = 0; F.forEach(([t, w]) => { if (t.includes(k)) s += w }); if (s) { score += s; hits.push(k) } });
      const t = tiles.find(([v, l]) => kws.some(k => (v + " " + l).toLowerCase().includes(k))) || tiles[0];
      return { c, score, hits, t };
    }
    function finderOut() {
      const G = GOALS.find(x => x[0] === goal), pool = CASES.filter(c => !sector || c.g === sector);
      if (!G && !sector) return `<p class="fd-hint">${ICON.spark}<span>Pick a goal above, and a sector if you like. Matching stories appear here.</span></p>`;
      let rs;
      if (G) {
        rs = pool.map(c => match(c, G[2])).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
        const top = rs.length ? rs[0].score : 0; rs = rs.filter(r => r.score >= top * .4).slice(0, 3);
      } else rs = pool.slice().sort((a, b) => (b.d ? 1 : 0) - (a.d ? 1 : 0)).slice(0, 3).map(c => ({ c, hits: [], t: tilesOf(c)[0] }));
      if (!rs.length) return `<p class="fd-hint">${ICON.spark}<span>No close match for that combination. Try another goal, or any sector.</span></p>`;
      const lbl = G ? `Matched on tags and results<span>· simple keyword rules over tags, headlines and approach</span>` : `Stories from ${esc(short(GROUPS.find(g => g.id === sector)))}`;
      return `<p class="fd-label">${ICON.spark}${lbl}</p>
  <ul class="fd-list">${rs.map((r, i) => {
        const c = r.c, g = grp(c); return `<li class="fd-item" style="--d:${i}">
    <span class="chip" style="${tint(g)}"><i></i>${esc(short(g))}</span>

    ${c.d ? `<a class="btn" href="#case/${c.id}">Read the full case study ${ICON.arrow}</a>` : ""}</li>`
      }).join("")}</ul>`;
    }

        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 6);
        return c;
      }));
      // Inside the atlas the route is drawn on the map itself, so cut the page line out of that band.
      const wb = $("#caseWorkbench", view), cut = $("#jpCut", svg);
      if (wb && cut) { cut.setAttribute("y", wb.getBoundingClientRect().top - wrap.getBoundingClientRect().top); cut.setAttribute("height", wb.offsetHeight) }
      JOURNEY = { wrap, draw, head: $(".jp-head", svg), len, lut, stops: pts.map((p, i) => ({ el: stopsG.children[i], len: journeyAt(lut, p.y)[0] })), at: -1 };
      updateJourney();
    }
    /* Draw the route up to the reading line (55% down the screen) and park the glowing head there. */
    function updateJourney() {
      const J = JOURNEY; if (!J || !J.draw.isConnected) return;
      const [l, x, y] = journeyAt(J.lut, innerHeight * .55 - J.wrap.getBoundingClientRect().top);
      if (Math.abs(l - J.at) < .5) return;
      J.at = l;
      J.draw.style.strokeDashoffset = RM ? 0 : J.len - l;
      J.head.setAttribute("cx", x.toFixed(1)); J.head.setAttribute("cy", y.toFixed(1));
      J.head.style.display = RM || l <= 0 ? "none" : "";
      J.stops.forEach(s => s.el.classList.toggle("on", l >= s.len - 1));
    }
    function frame() {
      const vh = innerHeight;
      if (!RM) {
        PLX.forEach(el => {
          if (!el.isConnected) return; const r = el.getBoundingClientRect(); if (r.bottom < -200 || r.top > vh + 200) return;
          el.style.setProperty("--plx-offset", `${((r.top + r.height / 2 - vh / 2) * +el.dataset.plx).toFixed(1)}px`)
        });
        const y = Math.min(scrollY, 4000); SKY.forEach(([el, f]) => { if (el) el.style.transform = `translate3d(0,${(-y * f).toFixed(1)}px,0)` });
      }
      updateJourney();
      // Journey rail: only while the atlas fills the screen.
      const jr = $("#jr", view), wb = $("#caseWorkbench", view);
      if (jr && wb) {
        const r = wb.getBoundingClientRect(), on = r.top < vh * .5 && r.bottom > vh * .5;
        if (on !== jr.classList.contains("on")) { jr.classList.toggle("on", on); if (!on) setRail(false) }
      }
      toTop.classList.toggle("on", scrollY > vh * .9 && !(jr && jr.classList.contains("on")));
      // Case page: story index progress.
      const cn = $(".cn-fill", view), cm = $(".case-detail .cmain", view);
      if (cn && cm) { const r = cm.getBoundingClientRect(); cn.style.transform = `scaleY(${clamp01((vh * .35 - r.top) / r.height).toFixed(4)})` }
      activeMapCheck();
    }
    function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; frame() }) }
    function setRail(open) {
      const jr = $("#jr", view); if (!jr) return;
      jr.classList.toggle("open", open);
      $(".jr-toggle", jr).setAttribute("aria-expanded", open);
    }
    /* Rebuild the scroll journey for one sector (or all) and restart it at its first client. */
    function applyFilter(f) {
      filter = f;
      $$("#orn button[data-f]", view).forEach(x => x.setAttribute("aria-pressed", x.dataset.f === f));
      const all = orderedCases(), wb = $("#caseWorkbench", view);
      if (!wb || !all.length) return;
      wb.style.setProperty("--case-count", all.length);
      $(".case-scroll-steps", wb).innerHTML = all.map(c => `<li data-step-case="${esc(c.s)}"></li>`).join("");
      ACTIVE_MAP_CASE = "";
      updateAtlasClient(all[0], true, 0);
    }
    function goToClient(c) {
      if (filter !== "all" && filter !== c.g) applyFilter("all");
      const m = atlasScrollMetrics(); if (!m) return;
      const i = m.cases.findIndex(x => x.s === c.s);
      if (i >= 0) scrollToAtlasCase(i, m);
    }
    function wireList() {
      const orn = $("#orn", view);
      if (orn) orn.addEventListener("click", e => {
        const b = e.target.closest("button[data-f]"); if (!b) return;
        applyFilter(b.dataset.f);
        const top = $("#caseWorkbench", view)?.getBoundingClientRect().top;
        if (top < 0) scrollTo({ top: top + scrollY - 90, behavior: "instant" });
        $(".orn-track", orn).scrollTo({ left: b.offsetLeft - 40, behavior: RM ? "auto" : "smooth" });
      });
      const jr = $("#jr", view);
      if (jr) jr.addEventListener("click", e => {
        const t = e.target.closest(".jr-toggle, [data-jr], [data-jr-sector], [data-jr-top]"); if (!t) return;
        if (t.classList.contains("jr-toggle")) { setRail(!jr.classList.contains("open")); return }
        if (t.hasAttribute("data-jr-top")) { setRail(false); view.focus({ preventScroll: true }); scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" }); return }
        const c = t.dataset.jr ? CASES.find(x => x.s === t.dataset.jr) : CASES.find(x => x.g === t.dataset.jrSector);
        setRail(false);
        view.focus({ preventScroll: true });
        if (c) goToClient(c);
      });
      const fd = $("#finder", view);
      if (fd) {
        const upd = () => {
          $("#fdOut", fd).innerHTML = finderOut();
          const G = GOALS.find(x => x[0] === goal), parts = [G && G[1], sector && short(GROUPS.find(g => g.id === sector))].filter(Boolean);
          $("#fdStatus", fd).textContent = !parts.length ? "" : $(".fd-list", fd) ? `Showing matching stories for ${parts.join(", ")}.` : "No close match. Try another goal or any sector.";
        };
        fd.addEventListener("click", e => {
          const b = e.target.closest("[data-goal]"); if (!b) return;
          goal = goal === b.dataset.goal ? "" : b.dataset.goal;
          $$("[data-goal]", fd).forEach(x => x.setAttribute("aria-pressed", x.dataset.goal === goal)); upd()
        });
        $("#fdSec", fd).addEventListener("change", e => { sector = e.target.value; upd() });
      }
      const st = $("#stack", view), hero = $(".hero", view);
      if (st && hero && !RM && matchMedia("(pointer: fine)").matches) {
        hero.addEventListener("pointermove", e => {
          const r = hero.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
          st.style.setProperty("--ry", (x * 10).toFixed(2) + "deg"); st.style.setProperty("--rx", (-y * 8).toFixed(2) + "deg")
        });
        hero.addEventListener("pointerleave", () => { st.style.setProperty("--ry", "0deg"); st.style.setProperty("--rx", "0deg") });
      }
      if (st && "IntersectionObserver" in window) { stackIO = new IntersectionObserver(([e]) => st.classList.toggle("paused", !e.isIntersecting)); stackIO.observe($("#stage", view)) }
    }
    function afterRender(c) {
      if (stackIO) { stackIO.disconnect(); stackIO = null }
      if (JOURNEY_RO) { JOURNEY_RO.disconnect(); JOURNEY_RO = null }
      if (SPY_IO) { SPY_IO.disconnect(); SPY_IO = null }
      // Parallax only on the heroes: measuring every tile on each scroll frame caused jank.
      PLX = RM ? [] : $$("[data-plx]", view).filter(el => el.closest(".hero, .chero-main"));
      sizeCaseWorkbench();
      const io = "IntersectionObserver" in window;
      if (c) {
        const mobile = matchMedia("(max-width:640px)").matches;
        detailDisclosureMobile = mobile;
        const profile = $(".case-detail .facts", view), brief = $(".case-detail .brief", view);
        if (profile) profile.open = !mobile;
        if (brief) brief.open = !mobile;
        $$(".case-detail .cmain > details.chapter", view).forEach(chapter => {
          chapter.open = !mobile || !!chapter.querySelector("#rs-h");
        });
        const links = $$(".case-detail .chapter-nav a", view);
        links.forEach(link => link.addEventListener("click", () => {
          const target = document.querySelector(link.hash);
          const chapter = target?.closest("details.chapter");
          if (chapter) chapter.open = true;
          if (target) setTimeout(() => target.scrollIntoView({ behavior: "instant", block: "start" }), 0);
        }));
        // Scroll-spy: highlight the chapter being read.
        if (io) {
          SPY_IO = new IntersectionObserver(es => es.forEach(e => {
            if (!e.isIntersecting) return;
            links.forEach(l => { const on = l.hash === "#" + e.target.id; l.classList.toggle("on", on); on ? l.setAttribute("aria-current", "location") : l.removeAttribute("aria-current") });
          }), { rootMargin: "-20% 0px -70% 0px" });
          links.forEach(l => { const t = document.querySelector(l.hash); if (t) SPY_IO.observe(t) });
        }
      } else detailDisclosureMobile = null;
      // Rebuild the route whenever the listing changes size: resizes, images and fonts loading, sector filters.
      JOURNEY = null;
      const jp = $("#jpath", view);
      if (jp && "ResizeObserver" in window) {
        let queued = false;
        JOURNEY_RO = new ResizeObserver(() => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; buildJourney() }) });
        JOURNEY_RO.observe(jp.parentElement);
      } else if (jp) buildJourney();
      const mapCase = c || orderedCases()[0];
      if (mapCase && $("#atlas-map", view)) updateAtlasClient(mapCase, true);
      if (!c) wireList();
      frame();
    }

    /* ---- chrome + router ---- */
    const hdr = document.getElementById("hdr");
    hdr.innerHTML = header();
    document.getElementById("foot").innerHTML = foot();
    const menuBtn = $(".menu-btn", hdr);
    const setMenu = o => { hdr.classList.toggle("open", o); menuBtn.setAttribute("aria-expanded", o) };
    menuBtn.addEventListener("click", () => setMenu(!hdr.classList.contains("open")));
    hdr.addEventListener("click", e => { if (e.target.closest(".nav a")) setMenu(false) });
    addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (hdr.classList.contains("open")) { setMenu(false); menuBtn.focus() }
      const jr = $("#jr", view);
      if (jr?.classList.contains("open")) { setRail(false); $(".jr-toggle", jr).focus() }
    });
    // One delegated listener: cards are re-rendered as the journey moves, so per-element wiring would be lost.
    document.addEventListener("click", e => {
      if (!e.target.closest("#jr")) setRail(false);
      if (e.target.closest("[data-atlas-next]")) { stepAtlas(1); return }
      const j = e.target.closest("[data-jump]"); if (!j) return;
      const t = document.getElementById(j.dataset.jump); if (!t) return;
      t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); const h = t.querySelector("h2"); if (h) h.focus({ preventScroll: true })
    });
    addEventListener("keydown", handleAtlasKeydown);
    addEventListener("wheel", handleAtlasWheel, { passive: false });
    document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); view.focus() });
    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("resize", () => {
      sizeCaseWorkbench();
      const mobile = matchMedia("(max-width:640px)").matches;
      if ($(".case-detail", view) && mobile !== detailDisclosureMobile) {
        detailDisclosureMobile = mobile;
        const profile = $(".case-detail .facts", view), brief = $(".case-detail .brief", view);
        if (profile) profile.open = !mobile;
        if (brief) brief.open = !mobile;
        $$(".case-detail .cmain > details.chapter", view).forEach(chapter => {
          chapter.open = !mobile || !!chapter.querySelector("#rs-h");
        });
      }
      if (GMAP) {
        const activeCase = CASES.find(c => c.s === ACTIVE_MAP_CASE);
        if (activeCase) positionAtlasMap(activeCase, true);
        if (GCARD) keepCardClear(GCARD);
      }
      onScroll();
    });
    // Where the reader was on the listing, so coming back from a case study returns them to the same client.
    let LIST_Y = null;
    function route() {
      const h = location.hash.slice(1);
      const c = h.startsWith("case/") ? CASES.find(x => x.d && x.id === h.slice(5)) : undefined;
      if (c && $(".wrap.journey", view)) LIST_Y = scrollY;
      const restore = !c && LIST_Y !== null ? LIST_Y : null;
      destroyAtlasMap();
      ACTIVE_MAP_CASE = "";
      view.innerHTML = c ? detail(c) : list();
      document.title = c ? `${c.n} · Case study · Apex Mind` : "Case Studies · Atlas Parallax · Apex Mind";
      setMenu(false);
      scrollTo({ top: 0, behavior: "instant" });
      afterRender(c);
      if (restore !== null) { scrollTo({ top: restore, behavior: "instant" }); LIST_Y = null; onScroll() }
      if (c) view.focus({ preventScroll: true });
      // A short fade-and-rise instead of an instant page swap.
      if (!RM && view.animate) view.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "cubic-bezier(.22,1,.36,1)" });
    }
    /* Back to top: appears once the reader is a screen down; hidden in the atlas, where the journey menu takes over. */
    const toTop = document.createElement("button");
    toTop.className = "to-top"; toTop.type = "button"; toTop.setAttribute("aria-label", "Back to top");
    toTop.innerHTML = `${ICON.down}<span>Top</span>`;
    toTop.addEventListener("click", () => { scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" }); setTimeout(() => (hdr.querySelector("a") || view).focus({ preventScroll: true }), RM ? 0 : 600) });
    document.body.appendChild(toTop);
    addEventListener("hashchange", () => {
      const hash = location.hash.slice(1);
      if (!hash || hash.startsWith("case/")) route();
    });
    route();
  </script>
</body>
