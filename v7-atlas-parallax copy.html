      if (card) {
        const cases = [...CASES.filter(item => item.featured), ...CASES.filter(item => !item.featured)];
        const cardIndex = Math.max(0, cases.findIndex(item => item.s === c.s));
        card.innerHTML = landscapeCard(c, cardIndex, cases.length);
        const scrollCard = $(".landscape-client-card", card), more = $(".landscape-card-more", card);
        const updateMore = () => {
          if (!scrollCard || !more) return;
          const atEnd = scrollCard.scrollTop + scrollCard.clientHeight >= scrollCard.scrollHeight - 4;
          more.hidden = scrollCard.scrollHeight <= scrollCard.clientHeight + 4;
          more.setAttribute("aria-label", atEnd ? "Back to top" : "View more details");
          more.title = atEnd ? "Back to top" : "View more details";
          more.querySelector("svg").innerHTML = atEnd ? '<path d="m18 15-6-6-6 6"/>' : '<path d="m6 9 6 6 6-6"/>';
        };
        more?.addEventListener("click", () => {
          if (!scrollCard) return;
          const atEnd = scrollCard.scrollTop + scrollCard.clientHeight >= scrollCard.scrollHeight - 4;
          scrollCard.scrollTo({ top: atEnd ? 0 : scrollCard.scrollTop + scrollCard.clientHeight * .8, behavior: "smooth" });
        });
        scrollCard?.addEventListener("scroll", updateMore, { passive: true });
        requestAnimationFrame(updateMore);
      }
      ACTIVE_MAP_CASE = c.s;
      if (!LEAFLET_MAP) { mountAtlasMap(c); return }
      LEAFLET_MAP.closePopup();
      LEAFLET_MARKERS.forEach(marker => marker.remove());
      LEAFLET_MARKERS = [];
      places.forEach((place, index) => {
        const icon = L.divIcon({
          className: "",
          html: index === 0 ? '<span class="atlas-pin-wrap"><i></i></span>' : '<span class="atlas-pin-secondary"></span>',
          iconSize: index === 0 ? [26, 26] : [14, 14],
          iconAnchor: index === 0 ? [13, 13] : [7, 7]
        });
        const marker = L.marker([place.lat, place.lng], { icon, keyboard: true, title: place.name }).addTo(LEAFLET_MAP);
        marker.bindPopup(photoPopup(c, place), { className: "atlas-photo-popup-wrap", closeButton: true, autoPan: false });
        marker.on("popupopen", () => {
          loadPopupPhoto(marker, c, place);
          requestAnimationFrame(() => keepPopupClearOfOverlays(marker));
        });
        LEAFLET_MARKERS.push(marker);
      });
      LEAFLET_MARKERS[primaryIndex]?.openPopup();
      LEAFLET_MAP.invalidateSize({ pan: false });
      positionAtlasMap(c, initial);
    }
    function activeMapCheck() {
      const workbench = $("#caseWorkbench", view);
      if (!workbench) return;
      const landscape = $(".case-landscape", workbench);
      if (!landscape) return;
      const bounds = workbench.getBoundingClientRect();
      const cases = [...CASES.filter(c => c.featured), ...CASES.filter(c => !c.featured)];
      if (!cases.length) return;
      const stickyTop = parseFloat(getComputedStyle(landscape).top) || 0;
      const scrollDistance = Math.max(1, workbench.offsetHeight - landscape.offsetHeight + stickyTop);
      const progress = Math.max(0, Math.min(1, (stickyTop - bounds.top) / scrollDistance));
      const step = progress * cases.length, index = Math.min(cases.length - 1, Math.floor(step));
      const c = cases[index];
      if (c && c.s !== ACTIVE_MAP_CASE) updateAtlasClient(c, false, index);
    }
    function atlasScrollMetrics() {
      const workbench = $("#caseWorkbench", view), landscape = workbench && $(".case-landscape", workbench);
      if (!workbench || !landscape) return null;
      const cases = [...CASES.filter(c => c.featured), ...CASES.filter(c => !c.featured)];
      const stickyTop = parseFloat(getComputedStyle(landscape).top) || 0;
      const distance = Math.max(1, workbench.offsetHeight - landscape.offsetHeight + stickyTop);
      const top = workbench.getBoundingClientRect().top + scrollY;
      const progress = Math.max(0, Math.min(1, (scrollY - top + stickyTop) / distance));
      return { workbench, landscape, cases, stickyTop, distance, top, progress };
    }
    function atlasScrollActive(metrics) {
      if (!metrics) return false;
      const bounds = metrics.workbench.getBoundingClientRect();
      return bounds.top <= metrics.stickyTop + 1 && bounds.bottom > innerHeight;
    }
    function scrollToAtlasCase(index, metrics) {
      const progress = (index + .5) / metrics.cases.length;
      const destination = metrics.top - metrics.stickyTop + progress * metrics.distance;
      const start = scrollY, distance = destination - start, duration = RM ? 0 : 2000, startTime = performance.now();
      atlasScrollLock = true;
      const finish = () => { scrollTo({ left: 0, top: destination, behavior: "instant" }); atlasScrollLock = false; onScroll() };
      if (!duration || Math.abs(distance) < 1) { finish(); return }
      const animate = now => {
        const elapsed = Math.min(1, (now - startTime) / duration);
        const eased = elapsed < .5 ? 4 * elapsed * elapsed * elapsed : 1 - Math.pow(-2 * elapsed + 2, 3) / 2;
        scrollTo({ left: 0, top: start + distance * eased, behavior: "instant" });
        if (elapsed < 1) requestAnimationFrame(animate);
        else finish();
      };
      requestAnimationFrame(animate);
    }
    function handleAtlasWheel(event) {
      if (event.defaultPrevented || event.ctrlKey || Math.abs(event.deltaY) < 1) return;
      const metrics = atlasScrollMetrics();
      if (!atlasScrollActive(metrics)) return;
      const card = event.target.closest?.(".landscape-client-card");
      if (card) {
        const canScroll = event.deltaY < 0 ? card.scrollTop > 0 : card.scrollTop + card.clientHeight < card.scrollHeight - 1;
        if (canScroll) return;
      }
      if (atlasScrollLock) { event.preventDefault(); return }
      const index = Math.min(metrics.cases.length - 1, Math.floor(metrics.progress * metrics.cases.length));
      const next = index + (event.deltaY > 0 ? 1 : -1);
      if (next < 0 || next >= metrics.cases.length) return;
      event.preventDefault();
      scrollToAtlasCase(next, metrics);
    }
    function handleAtlasKeydown(event) {
      if (!["ArrowDown", "ArrowUp", "PageDown", "PageUp", " "].includes(event.key)) return;
      const metrics = atlasScrollMetrics();
      if (!atlasScrollActive(metrics)) return;
      if (event.target.closest?.("input,textarea,select,button,a,[contenteditable=true]")) return;
      if (atlasScrollLock) { event.preventDefault(); return }
      const down = event.key === "ArrowDown" || event.key === "PageDown" || event.key === " ";
      const index = Math.min(metrics.cases.length - 1, Math.floor(metrics.progress * metrics.cases.length));
      const next = index + (down ? 1 : -1);
      if (next < 0 || next >= metrics.cases.length) return;
      event.preventDefault();
      scrollToAtlasCase(next, metrics);
    }
    function sizeCaseWorkbench() {
      const workbench = $("#caseWorkbench", view);
      if (!workbench) return;
      workbench.style.width = "100%";
      workbench.style.marginLeft = "0";
      const left = workbench.getBoundingClientRect().left;
      workbench.style.width = `${document.documentElement.clientWidth}px`;
      workbench.style.marginLeft = `${-left}px`;
    }
    function frame() {
      const vh = innerHeight;
      if (!RM) {
        PLX.forEach(el => {
          if (!el.isConnected) return; const r = el.getBoundingClientRect(); if (r.bottom < -200 || r.top > vh + 200) return;
          el.style.setProperty("--plx-offset", `${((r.top + r.height / 2 - vh / 2) * +el.dataset.plx).toFixed(1)}px`)
        });
        const y = Math.min(scrollY, 4000); SKY.forEach(([el, f]) => { if (el) el.style.transform = `translate3d(0,${(-y * f).toFixed(1)}px,0)` });
      }
      activeMapCheck();
      ornCheck();
    }
    function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; frame() }) }
    /* Keep the sector controls visible without covering the cards' scroll animations. */
    function ornCheck() {
      const o = document.getElementById("orn"), slot = document.getElementById("ornSlot"), cards = document.getElementById("cards");
      if (!o || !slot || !cards) return;
      const s = slot.getBoundingClientRect(), k = cards.getBoundingClientRect(), f = s.top < 84 && k.bottom > innerHeight * .55;
      if (f !== o.classList.contains("float")) o.classList.toggle("float", f);
    }
    function wireList() {
      const orn = $("#orn", view);
      if (orn) orn.addEventListener("click", e => {
        const b = e.target.closest("button[data-f]"); if (!b) return;
        filter = b.dataset.f;
        $$("button", orn).forEach(x => x.setAttribute("aria-pressed", x === b));
        $$("#cards .card", view).forEach(x => {
          const h = filter !== "all" && filter !== x.dataset.g; x.hidden = h;
          if (!h && !RM) { x.classList.remove("pop"); void x.offsetWidth; x.classList.add("pop") }
        });
        activeMapCheck();
        b.scrollIntoView({ block: "nearest", inline: "center", behavior: RM ? "auto" : "smooth" });
        if (orn.classList.contains("float")) { const k = $("#cards", view); scrollTo({ top: k.getBoundingClientRect().top + scrollY - 110, behavior: RM ? "auto" : "smooth" }) }
      });
      const fd = $("#finder", view);
      if (fd) {
        const upd = () => {
          $("#fdOut", fd).innerHTML = finderOut();
          const G = GOALS.find(x => x[0] === goal), parts = [G && G[1], sector && short(GROUPS.find(g => g.id === sector))].filter(Boolean);
          $("#fdStatus", fd).textContent = !parts.length ? "" : $(".fd-list", fd) ? `Showing matching stories for ${parts.join(", ")}.` : "No close match. Try another goal or any sector.";
        };
        fd.addEventListener("click", e => {
          const b = e.target.closest("[data-goal]"); if (!b) return;
          goal = goal === b.dataset.goal ? "" : b.dataset.goal;
          $$("[data-goal]", fd).forEach(x => x.setAttribute("aria-pressed", x.dataset.goal === goal)); upd()
        });
        $("#fdSec", fd).addEventListener("change", e => { sector = e.target.value; upd() });
      }
      const st = $("#stack", view), hero = $(".hero", view);
      if (st && hero && !RM && matchMedia("(pointer: fine)").matches) {
        hero.addEventListener("pointermove", e => {
          const r = hero.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
          st.style.setProperty("--ry", (x * 10).toFixed(2) + "deg"); st.style.setProperty("--rx", (-y * 8).toFixed(2) + "deg")
        });
        hero.addEventListener("pointerleave", () => { st.style.setProperty("--ry", "0deg"); st.style.setProperty("--rx", "0deg") });
      }
      if (st && "IntersectionObserver" in window) { stackIO = new IntersectionObserver(([e]) => st.classList.toggle("paused", !e.isIntersecting)); stackIO.observe($("#stage", view)) }
    }
    function afterRender(c) {
      if (stackIO) { stackIO.disconnect(); stackIO = null }
      PLX = RM ? [] : $$("[data-plx]", view);
      sizeCaseWorkbench();
      if (c) {
        const mobile = matchMedia("(max-width:640px)").matches;
        detailDisclosureMobile = mobile;
        const profile = $(".case-detail .facts", view), brief = $(".case-detail .brief", view);
        if (profile) profile.open = !mobile;
        if (brief) brief.open = !mobile;
        $$(".case-detail .cmain > details.chapter", view).forEach(chapter => {
          chapter.open = !mobile || !!chapter.querySelector("#rs-h");
        });
        $$(".case-detail .chapter-nav a", view).forEach(link => link.addEventListener("click", () => {
          const target = document.querySelector(link.hash);
          const chapter = target?.closest("details.chapter");
          if (chapter) chapter.open = true;
          if (target) setTimeout(() => target.scrollIntoView({ behavior: "instant", block: "start" }), 0);
        }));
      } else detailDisclosureMobile = null;
      const mapCase = c || CASES.find(x => x.featured) || CASES[0];
      if (mapCase && $("#atlas-map", view)) updateAtlasClient(mapCase, true);
      if (!c) wireList();
      $$("[data-jump]", view).forEach(b => b.addEventListener("click", () => {
        const t = document.getElementById(b.dataset.jump); if (!t) return;
        t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); const h = t.querySelector("h2"); if (h) h.focus({ preventScroll: true })
      }));
      frame();
    }

    /* ---- chrome + router ---- */
    const hdr = document.getElementById("hdr");
    hdr.innerHTML = header();
    document.getElementById("foot").innerHTML = foot();
    const menuBtn = $(".menu-btn", hdr);
    const setMenu = o => { hdr.classList.toggle("open", o); menuBtn.setAttribute("aria-expanded", o) };
    menuBtn.addEventListener("click", () => setMenu(!hdr.classList.contains("open")));
    hdr.addEventListener("click", e => { if (e.target.closest(".nav a")) setMenu(false) });
    addEventListener("keydown", e => { if (e.key === "Escape" && hdr.classList.contains("open")) { setMenu(false); menuBtn.focus() } });
    addEventListener("keydown", handleAtlasKeydown);
    addEventListener("wheel", handleAtlasWheel, { passive: false });
    document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); view.focus() });
    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("resize", () => {
      sizeCaseWorkbench();
      const mobile = matchMedia("(max-width:640px)").matches;
      if ($(".case-detail", view) && mobile !== detailDisclosureMobile) {
        detailDisclosureMobile = mobile;
        const profile = $(".case-detail .facts", view), brief = $(".case-detail .brief", view);
        if (profile) profile.open = !mobile;
        if (brief) brief.open = !mobile;
        $$(".case-detail .cmain > details.chapter", view).forEach(chapter => {
          chapter.open = !mobile || !!chapter.querySelector("#rs-h");
        });
      }
      if (LEAFLET_MAP) {
        LEAFLET_MAP.invalidateSize({ pan: false });
        const activeCase = CASES.find(c => c.s === ACTIVE_MAP_CASE);
        if (activeCase) positionAtlasMap(activeCase, true);
      }
      onScroll();
    });
    function route() {
      const h = location.hash.slice(1);
      const c = h.startsWith("case/") ? CASES.find(x => x.d && x.id === h.slice(5)) : undefined;
      destroyAtlasMap();
      ACTIVE_MAP_CASE = "";
      view.innerHTML = c ? detail(c) : list();
      document.title = c ? `${c.n} · Case study · Apex Mind` : "Case Studies · Atlas Parallax · Apex Mind";
      setMenu(false);
      scrollTo({ top: 0, behavior: "instant" });
      afterRender(c);
      if (c) view.focus({ preventScroll: true });
    }
    addEventListener("hashchange", () => {
      const hash = location.hash.slice(1);
      if (!hash || hash.startsWith("case/")) route();
    });
    route();
  </script>
